name: Plugin checks

on:
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/plugin/marketplace.json'
      - 'CODEOWNERS'
      - 'checks/**'
      - '.github/workflows/plugin-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - '.github/plugin/marketplace.json'
      - 'CODEOWNERS'
      - 'checks/**'
      - '.github/workflows/plugin-checks.yml'

permissions:
  contents: read

jobs:
  check-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - run: npm ci --prefix checks --ignore-scripts
      - run: node --test checks/check-plugins.test.mjs
      - name: Check plugins
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm --prefix checks --silent run check-plugins -- "$BASE_COMMIT"
